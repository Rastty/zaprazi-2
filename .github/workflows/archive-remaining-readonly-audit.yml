name: Zápraží Legacy Archive Remaining Readonly Audit

on:
  pull_request:
    paths:
      - "scripts/audit-remaining-archive-after-trash.mjs"
      - ".github/workflows/archive-remaining-readonly-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only enumerate remaining published WordPress posts
        run: node scripts/audit-remaining-archive-after-trash.mjs
