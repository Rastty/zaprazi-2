name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Check frontend JavaScript syntax
        run: |
          node --check assets/js/runtime-config.js
          node --check assets/js/mobility-advisor.js
          node --check src/mobility/engine.js
          node --check src/mobility/catalog.js
          node --check src/mobility/acquisition.js
      - name: Guard advisor privacy fallback
        run: |
          if grep -q '<form id="zp-mobility-advisor"' front-page.php; then
            echo "Advisor must not use native form submission."
            exit 1
          fi
          if grep -q 'new FormData' assets/js/mobility-advisor.js; then
            echo "Advisor must not depend on FormData/native form submission."
            exit 1
          fi
      - name: Guard explicit safety answers
        run: |
          if grep -q 'name="handBrakes" value="unknown" checked' front-page.php; then
            echo "Brake safety answer must not be preselected."
            exit 1
          fi
          if grep -q 'name="canLiftWalker" value="unknown" checked' front-page.php; then
            echo "Lift safety answer must not be preselected."
            exit 1
          fi
      - name: Lint WordPress PHP
        run: |
          php -l functions.php
          php -l header.php
          php -l footer.php
          php -l front-page.php
          php -l index.php
          php -l archive.php
          php -l woocommerce.php
          php -l single.php
          php -l page.php
