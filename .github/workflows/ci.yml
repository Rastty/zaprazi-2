name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Lint WordPress PHP
        run: |
          php -l functions.php
          php -l header.php
          php -l footer.php
          php -l front-page.php
          php -l index.php
          php -l single.php
          php -l page.php
