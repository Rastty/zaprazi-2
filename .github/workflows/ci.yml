name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Test reversible legacy HTML canary without WordPress
        run: php tests/legacy-document-shell.php
      - name: Check every JavaScript source and test syntax
        run: |
          find assets/js src tests -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Guard advisor privacy fallback
        run: |
          if grep -q '<form id="zp-mobility-advisor"' front-page.php; then
            echo "Advisor must not use native form submission."
            exit 1
          fi
          if grep -q 'new FormData' assets/js/mobility-advisor.js; then
            echo "Advisor must not depend on FormData/native form submission."
            exit 1
          fi
      - name: Guard explicit safety answers
        run: |
          if grep -q 'name="handBrakes" value="unknown" checked' front-page.php; then
            echo "Brake safety answer must not be preselected."
            exit 1
          fi
          if grep -q 'name="canLiftWalker" value="unknown" checked' front-page.php; then
            echo "Lift safety answer must not be preselected."
            exit 1
          fi
      - name: Lint all tracked WordPress theme PHP files
        run: |
          # New advisor templates must be linted automatically; never rely on
          # a hand-maintained list that omits most production PHP files.
          git ls-files -z -- '*.php' | xargs -0 -r -n1 php -l
