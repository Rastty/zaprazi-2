name: Five Advisor Guides Live Acceptance

on:
  pull_request:
    paths:
      - "scripts/audit-live-five-action-guides.mjs"
      - ".github/workflows/five-guides-live-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-five-guides:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check read-only production audit syntax
        run: node --check scripts/audit-live-five-action-guides.mjs
      - name: Verify actual deployed 0.8.162 and five decision journeys
        env:
          ZP_LIVE_ORIGIN: https://zaprazi.cz
          ZP_REQUIRED_LIVE_RELEASE: 0.8.162
        run: node scripts/audit-live-five-action-guides.mjs
