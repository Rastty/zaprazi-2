name: Legacy URL inventory export

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/export-legacy-url-inventory.mjs
      - .github/workflows/legacy-inventory-export.yml

permissions:
  contents: write

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Export published legacy URLs
        run: node scripts/export-legacy-url-inventory.mjs
      - name: Validate inventory
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const summary = JSON.parse(fs.readFileSync("data/legacy-url-inventory.summary.json", "utf8"));
          const rows = fs.readFileSync("data/legacy-url-inventory.csv", "utf8").trim().split("\n").length - 1;
          if (summary.counts.posts < 4000) throw new Error("Expected at least 4,000 published posts");
          if (summary.counts.pages < 4) throw new Error("Expected at least 4 published pages");
          if (rows !== summary.counts.total) throw new Error(`CSV rows ${rows} != summary total ${summary.counts.total}`);
          if (summary.unique_urls !== summary.counts.total) throw new Error("Inventory contains duplicate URLs");
          console.log(summary);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: zaprazi-legacy-url-inventory
          path: |
            data/legacy-url-inventory.csv
            data/legacy-url-inventory.summary.json
          retention-days: 14
      - name: Commit authoritative inventory snapshot
        run: |
          if git diff --quiet -- data/legacy-url-inventory.csv data/legacy-url-inventory.summary.json; then
            echo "Inventory unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legacy-url-inventory.csv data/legacy-url-inventory.summary.json
          git commit -m "Snapshot published legacy URL inventory"
          git push origin HEAD:${{ github.head_ref }}
