name: Live Bathroom Explicit Negative Fit Chrome PR501
on:
  pull_request:
    paths:
      - "scripts/audit-live-bathroom-explicit-no-fit-501.mjs"
      - ".github/workflows/live-bathroom-explicit-no-fit-501.yml"
  push:
    branches: [main]
    paths:
      - "scripts/audit-live-bathroom-explicit-no-fit-501.mjs"
      - ".github/workflows/live-bathroom-explicit-no-fit-501.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check actual Chrome smoke
        run: node --check scripts/audit-live-bathroom-explicit-no-fit-501.mjs
      - name: Install Puppeteer driver
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Verify real negative-fit branches on the live website
        env:
          CHROME_BIN: /usr/bin/google-chrome
          ZP_LIVE_ORIGIN: https://zaprazi.cz
        run: node scripts/audit-live-bathroom-explicit-no-fit-501.mjs
