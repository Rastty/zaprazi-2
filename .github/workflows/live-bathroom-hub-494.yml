name: Live Bathroom Hub Chrome Acceptance (PR494)
on:
  pull_request:
    paths:
      - "scripts/audit-live-bathroom-hub-494.mjs"
      - ".github/workflows/live-bathroom-hub-494.yml"
  push:
    branches: [main]
    paths:
      - "scripts/audit-live-bathroom-hub-494.mjs"
      - ".github/workflows/live-bathroom-hub-494.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate live browser audit syntax
        run: node --check scripts/audit-live-bathroom-hub-494.mjs
      - name: Install Chrome driver
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Actual production Bathroom hub workflow after PR494
        env:
          CHROME_BIN: /usr/bin/google-chrome
          ZP_LIVE_ORIGIN: https://zaprazi.cz
        run: node scripts/audit-live-bathroom-hub-494.mjs
