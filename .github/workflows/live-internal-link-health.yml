name: Live Internal Link Health Audit

on:
  pull_request:
    paths:
      - "scripts/audit-public-sitemap.mjs"
      - "scripts/audit-live-internal-links.mjs"
      - "scripts/lib/internal-link-health.mjs"
      - "tests/internal-link-health.test.js"
      - ".github/workflows/live-internal-link-health.yml"
  workflow_dispatch:
  # After successful exact-release main Chrome QA, scan live links immediately.
  # PR and scheduled QA events do not cause a duplicate link crawl.
  workflow_run:
    workflows: ["Production Advisor Browser QA"]
    types: [completed]
  schedule:
    # Public read-only check, off-peak. The live WordPress CMS can change without a Git PR.
    - cron: "41 3 * * *"

permissions:
  contents: read

jobs:
  link-health:
    # A completed parent does not imply successful deployment: gate explicitly.
    # A PR or daily scheduled Chrome QA must not start a duplicate link scan.
    if: >-
      ${{ github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main' &&
         (github.event.workflow_run.event == 'push' ||
          github.event.workflow_run.event == 'workflow_dispatch')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit-test bounded first-party link checker
        run: node --test tests/internal-link-health.test.js
      - name: Install read-only browser adapter
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Verify all curated live decision-page links and fragment anchors
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-internal-links.mjs
