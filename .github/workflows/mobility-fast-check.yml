name: Mobility shrinkable safety properties (read-only)

on:
  pull_request:
    paths:
      - "src/mobility/engine.js"
      - "scripts/qa/mobility-fast-check.mjs"
      - "scripts/lib/mobility-property-invariants.mjs"
      - "tests/mobility-property-invariants.test.js"
      - ".github/workflows/mobility-fast-check.yml"
  push:
    branches: [main]
    paths:
      - "src/mobility/engine.js"
      - "scripts/qa/mobility-fast-check.mjs"
      - "scripts/lib/mobility-property-invariants.mjs"
      - "tests/mobility-property-invariants.test.js"
      - ".github/workflows/mobility-fast-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zaprazi-readonly-fast-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobility-properties:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify local invariants and script syntax
        run: |
          node --check scripts/qa/mobility-fast-check.mjs
          node --test tests/mobility-property-invariants.test.js
      - name: Install pinned MIT fast-check for isolated test job only
        run: npm install --no-save --no-package-lock fast-check@4.10.2
      - name: Shrinkable seeded Mobility safety and acquisition properties
        run: node scripts/qa/mobility-fast-check.mjs
