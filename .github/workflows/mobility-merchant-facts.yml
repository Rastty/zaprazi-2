name: Mobility merchant facts — read-only evidence
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mobility-merchant-facts.yml"
      - "scripts/audit-mobility-merchant-facts.mjs"
      - "scripts/audit-meyra-public-identity.mjs"
      - "tests/meyra-public-identity.test.js"
      - "src/mobility/catalog.js"
  workflow_dispatch:
  schedule:
    # Once per week; not an inventory/price feed and never affiliate traffic.
    - cron: "11 5 * * 2"
permissions:
  contents: read
jobs:
  merchant-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify exact approved public merchant URL contracts offline
        run: node --test tests/mobility-merchant-facts.test.js tests/meyra-public-identity.test.js
      - name: Inspect two public product pages without affiliate requests
        run: node scripts/audit-mobility-merchant-facts.mjs
      - name: Check official MEYRA 3061982 against the canonical public Lékárna product page
        run: node scripts/audit-meyra-public-identity.mjs
