name: Prepare bounded 0.8.195 footer consent release (branch-only)

on:
  push:
    branches:
      - growth/performance-footer-consent-195
    paths:
      - .github/workflows/prepare-consent-195.yml

permissions:
  contents: write

concurrency:
  group: prepare-consent-195-branch-only
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Rastty/zaprazi-2' && github.ref == 'refs/heads/growth/performance-footer-consent-195'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: growth/performance-footer-consent-195
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate exact release invariants and prepare 0.8.195 with the single footer enqueue change
        run: node scripts/prepare-consent-195.mjs
      - name: Validate complete theme regression and PHP syntax before any release commit
        run: |
          npm test
          php -l functions.php
          php -l header.php
          php -l footer.php
          php -l page-choditka-pro-seniory.php
      - name: Commit complete exact 0.8.195 release on isolated feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- functions.php style.css header.php footer.php front-page.php page-*.php assets/js src
          if git diff --cached --quiet; then
            echo "No theme version/runtime changes"
            exit 0
          fi
          git commit -m "Release 0.8.195: move optional consent adapter from head to footer"
          git push origin HEAD:refs/heads/growth/performance-footer-consent-195
