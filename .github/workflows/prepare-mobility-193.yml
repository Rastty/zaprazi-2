# Retry after aligning release-dependent regressions and critical blob lock recalculation
name: Prepare bounded 0.8.193 theme release (branch-only)

on:
  push:
    branches:
      - growth/mobility-acquisition-direct-advisor-193
    paths:
      - .github/workflows/prepare-mobility-193.yml

permissions:
  contents: write

concurrency:
  group: prepare-mobility-193-branch-only
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Rastty/zaprazi-2' && github.ref == 'refs/heads/growth/mobility-acquisition-direct-advisor-193'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: growth/mobility-acquisition-direct-advisor-193
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate and prepare exact 0.8.193 markers and two editorial CTA changes
        run: node scripts/prepare-mobility-193.mjs
      - name: Test all release invariants before proposing code
        run: |
          npm test
          php -l functions.php
          php -l page-pujceni-choditka.php
          php -l page-choditko-na-pojistovnu.php
      - name: Commit release-only changes to this PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- functions.php style.css header.php footer.php front-page.php page-*.php assets/js src
          if git diff --cached --quiet; then
            echo "No release changes"
            exit 0
          fi
          git commit -m "Release 0.8.193: synchronize theme integrity and direct Advisor entry"
          git push origin HEAD:refs/heads/growth/mobility-acquisition-direct-advisor-193
