name: Production Advisor Browser QA

on:
  pull_request:
    paths:
      - "tests/production-advisor-smoke.mjs"
      - ".github/workflows/production-advisor-qa.yml"
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install read-only browser smoke dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Run safety and purchase-gate QA against deployed production
        env:
          ZP_LIVE_ORIGIN: https://zaprazi.cz
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/production-advisor-smoke.mjs
