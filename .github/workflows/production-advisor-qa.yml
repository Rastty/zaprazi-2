name: Production Advisor Browser QA

on:
  # An explicit versioned postdeploy acknowledgment triggers exact-source
  # read-only Chrome QA without needing workflow_dispatch credentials.
  # This must never build, deploy or write to WordPress.
  push:
    branches:
      - main
    paths:
      - "docs/POSTDEPLOY_QA_TRIGGER.md"
  pull_request:
    paths:
      - "tests/production-advisor-smoke.mjs"
      - "scripts/audit-live-mobility-offer-parity.mjs"
      - "tests/live-mobility-offer-parity.test.js"
      - "scripts/audit-live-bed-cost.mjs"
      - "scripts/audit-live-human-ux-186.mjs"
      - "scripts/audit-live-return-home-ux-185.mjs"
      - "scripts/audit-live-release-coherence.mjs"
      - "tests/audit-live-release-coherence.test.js"
      - "scripts/audit-live-mobility-acquisition-184.mjs"
      - "scripts/audit-live-mobility-hub-194.mjs"
      - "scripts/audit-live-consent-footer-195.mjs"
      - "scripts/audit-live-insurance-model-identity-196.mjs"
      - "scripts/audit-live-walker-safety-197.mjs"
      - "scripts/audit-live-walker-hero-198.mjs"
      - "scripts/audit-live-insurance-first-199.mjs"
      - "scripts/audit-live-insurance-prep-201.mjs"
      - "scripts/audit-live-walker-acquisition-202.mjs"
      - "tests/walker-measurement-acquisition-202.test.js"
      - "tests/insurance-doctor-dispenser-201.test.js"
      - "tests/walker-insurance-first-answer.test.js"
      - "tests/audit-live-insurance-first-199.test.js"
      - "scripts/audit-live-mobility-guide-handoff-200.mjs"
      - "tests/live-mobility-handoff-200-contract.test.js"
      - "tests/walker-hero-direct-paths-198.test.js"
      - "tests/walker-sukl-model-identity-196.test.js"
      - "tests/audit-live-walker-safety-197.test.js"
      - "tests/analytics-footer-loading-195.test.js"
      - "tests/mobility-hub-direct-advisor-194.test.js"
      - "tests/audit-live-mobility-acquisition-184.test.js"
      - "tests/advisor-request-privacy.mjs"
      - "tests/advisor-request-privacy.test.js"
      - "scripts/audit-live-night-wc-navigation.mjs"
      - "scripts/audit-live-walker-hub.mjs"
      - "scripts/audit-live-bed-cost.mjs"
      - "scripts/audit-live-wheelchair-doorway.mjs"
      - "scripts/audit-live-bathroom-measurements.mjs"
      - "scripts/audit-live-bathroom-result-handoff.mjs"
      - "scripts/audit-live-result-measurement-tab.mjs"
      - "scripts/audit-live-reimbursement-tab.mjs"
      - "src/bathroom/acquisition-view.js"
      - "scripts/audit-live-bathroom-product-provenance.mjs"
      - "src/bathroom/source-transparency.js"
      - "src/bathroom/measurement-next-step.js"
      - "assets/js/toilet-riser-advisor.js"
      - "assets/js/toilet-support-advisor.js"
      - "assets/js/toilet-chair-advisor.js"
      - "assets/js/shower-chair-advisor.js"
      - "assets/js/bath-transfer-advisor.js"
      - "scripts/audit-live-search-guidance.mjs"
      - "scripts/audit-live-editorial-seo.mjs"
      - "scripts/audit-live-sukl-handoff-189.mjs"
      - "scripts/audit-live-indoor-walker-doorway-190.mjs"
      - "scripts/audit-live-indoor-walker-threshold-191.mjs"
      - "scripts/lib/yoast-https-graph.mjs"
      - "scripts/audit-live-problem-guides.mjs"
      - "scripts/audit-live-legacy-canary-dom.mjs"
      - ".github/workflows/production-advisor-qa.yml"
  workflow_dispatch:
  schedule:
    # Daily read-only production Chrome QA across all 14 existing Advisors.
    # GitHub cron uses UTC; 03:43 UTC is 04:43 CET / 05:43 CEST.
    # Unlike PR predeploy checks, scheduled QA must require the source release.
    - cron: "43 3 * * *"

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install read-only browser smoke dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Syntax-check 0.8.191 postdeploy Chrome scenario before deployment
        run: node --check scripts/audit-live-indoor-walker-threshold-191.mjs
      - name: Resolve current production release for PR-only checks
        env:
          ZP_LIVE_ORIGIN: https://zaprazi.cz
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          # On a PR, the next release is not deployed yet: audit the live version.
          # On manual dispatch (after deploy), enforce the checked-out source version.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LIVE_VERSION="$(curl --fail --silent --show-error --location https://zaprazi.cz/wp-json/zaprazi/v1/affiliate-readiness | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{let v=JSON.parse(s).release;if(!/^\\d+\\.\\d+\\.\\d+$/.test(v))process.exit(1);process.stdout.write(v)})")"
            test -n "$LIVE_VERSION"
            echo "::notice::Pre-deploy QA runs against currently deployed release $LIVE_VERSION. Manually dispatch this workflow after the new version is deployed."
            export ZP_RELEASE="$LIVE_VERSION"
            echo "ZP_RELEASE=$LIVE_VERSION" >> "$GITHUB_ENV"
          fi

      # Fail closed before the lengthy 14-Advisor browser suite if a WordPress
      # Pull + Deploy is partial or CDN pages disagree with the readiness API.
      # PRs use the observed live release; schedule/dispatch require source.
      - name: Fail fast on mixed production release or incomplete readiness
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-release-coherence.mjs
      - name: Confirm deployed bed-cost calculator clears obsolete result on invalid input
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-bed-cost.mjs
      - name: Run safety and purchase-gate QA against deployed production
        env:
          ZP_LIVE_ORIGIN: https://zaprazi.cz
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/production-advisor-smoke.mjs
      - name: Verify exact live WA17, WA21 and MEYRA affiliate slots behind model fit gates
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-mobility-offer-parity.mjs
      - name: Check night-toilet issue routing and reciprocal links in deployed DOM
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-night-wc-navigation.mjs
      - name: Verify search rescue on deployed multilingual and multiword queries
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-search-guidance.mjs
      - name: Check latest published problem guides, SEO, safety and real inbound links
        env:
          ZP_LIVE_ORIGIN: https://zaprazi.cz
          CHROME_BIN: /usr/bin/google-chrome
          ZP_REQUIRED_LIVE_RELEASE: "0.8.156"
        run: node scripts/audit-live-problem-guides.mjs
      - name: Verify live walker problem-to-advisor decision routing and reciprocal links
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-walker-hub.mjs
      - name: Verify wheelchair doorway measuring guide and private width checker
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-wheelchair-doorway.mjs
      - name: Validate bathroom guide and six contextual stage-two measurement routes
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-bathroom-measurements.mjs
      - name: Verify real blocked and approved bathroom results route correctly
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-bathroom-result-handoff.mjs
      - name: Verify result measuring links preserve five unfinished advisor sessions
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-result-measurement-tab.mjs
      - name: Check reimbursement help preserves five completed bathroom results
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-reimbursement-tab.mjs
      - name: Check live product source dates and affiliate transparency after release
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-bathroom-product-provenance.mjs
      # PRs inspect the old live release; scheduled and manual postdeploy QA
      # must validate the exact checked-out release and its Mobility handoffs.
      - name: Strict Mobility acquisition paths (scheduled and postdeploy)
        if: github.event_name != 'pull_request'
        run: node scripts/audit-live-mobility-acquisition-184.mjs
      - name: Verify 0.8.193 direct acquisition-to-Advisor handoffs in real Chrome
        if: github.event_name != 'pull_request'
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-mobility-direct-entry-193.mjs
      - name: Verify 0.8.194 Mobility hub hero-to-Advisor handoff in real Chrome
        if: github.event_name != 'pull_request'
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-mobility-hub-194.mjs
      - name: Verify 0.8.195 footer consent and Mobility-to-Advisor handoff in real Chrome
        if: github.event_name != 'pull_request'
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-consent-footer-195.mjs
      - name: Verify exact 0.8.196 model identity and historical SÚKL disclosure in real Chrome
        if: github.event_name != 'pull_request'
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-insurance-model-identity-196.mjs
      - name: Verify exact 0.8.197 walker brake and reimbursement warnings in real Chrome
        if: github.event_name != 'pull_request'
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-walker-safety-197.mjs
      - name: Verify 0.8.198 direct indoor and outdoor walker Advisor links in real Chrome
        if: github.event_name != 'pull_request'
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-walker-hero-198.mjs
      - name: Verify 0.8.199 ePoukaz first-screen safe answer and Advisor handoff in Chrome
        if: github.event_name != 'pull_request'
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-insurance-first-199.mjs
      - name: Verify 0.8.200 Mobility guide to Advisor handoffs in Chrome
        if: github.event_name != 'pull_request'
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-mobility-guide-handoff-200.mjs
      - name: Verify 0.8.201 ePoukaz doctor/dispenser prep and safe links on live site
        if: github.event_name != 'pull_request'
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-insurance-prep-201.mjs
      - name: Verify 0.8.202 walker measurements hand off safely to buy rent or ePoukaz
        if: github.event_name != 'pull_request'
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-walker-acquisition-202.mjs

  # Independent acceptance for the release-specific return-home UX.
  # Never test future 0.8.185 HTML against an older live release on a PR.
  # Scheduled/authorized manual dispatch checks the deployed theme version.
  return-home-ux-185:
    # Test-only QA branch checks public release read-only; not a release acceptance.
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'qa/186-live-browser-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install read-only browser audit dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Verify mobile return-home safety plan and six live guide anchors
        env:
          CHROME_BIN: /usr/bin/google-chrome
          ZP_SAME_RELEASE_QA_PR: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'qa/186-live-browser-') && '1' || '0' }}
        run: node scripts/audit-live-return-home-ux-185.mjs

  # Independent 0.8.186 visitor-journey QA: real Chrome, only AFTER deploy.
  # A PR tests the old public release, not future HTML or price entry.
  human-ux-186:
    # Test-only QA branch checks public release read-only; not a release acceptance.
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'qa/186-live-browser-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install read-only Chrome acceptance dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Validate own-price rental calculator and critical-first return-home summary
        env:
          CHROME_BIN: /usr/bin/google-chrome
          ZP_SAME_RELEASE_QA_PR: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'qa/186-live-browser-') && '1' || '0' }}
        run: node scripts/audit-live-human-ux-186.mjs

  mobility-first-action-187:
    # Real Chrome acceptance of the exact NEW release; PR builds audit OLD live version.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install read-only Chrome acceptance dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Test the new homepage Mobility first-action safety journey
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-mobility-first-action-187.mjs

  editorial-advisor-funnel-188:
    # PRs check the currently deployed old release, not future theme HTML.
    # Run this strict acceptance only after the owner's manual WordPress deploy.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install real Chrome read-only acceptance
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Verify six editorial journeys, release marker and privacy
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-editorial-advisor-funnel-188.mjs

  sukl-monthly-source-189:
    # PRs check the previous release. Exact 0.8.189 only after manual WordPress deploy.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install read-only Chrome dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Verify official SÚKL source handoff and historical-amount guard
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-sukl-handoff-189.mjs

  indoor-walker-doorway-190:
    # Only exact-source, postdeploy/scheduled Chrome QA. A PR tests the older live release.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
