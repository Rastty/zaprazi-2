  indoor-walker-threshold-191:
    # Real visitor click and fragment acceptance only after source release deploy.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install read-only Chrome adapter
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Verify 0.8.191 narrow-doorway to threshold guide click in Chrome
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-indoor-walker-threshold-191.mjs

  editorial-seo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install read-only browser audit dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Preflight render of real cohort article bodies (no WordPress writes)
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-legacy-cohort-preflight.mjs
      - name: Audit all core decision pages for SEO and internal link health
        env:
          CHROME_BIN: /usr/bin/google-chrome
          ZP_ALLOW_CANONICAL_HTTP_ON_0_8_134: ${{ github.event_name == 'pull_request' }}
        run: node scripts/audit-live-editorial-seo.mjs
