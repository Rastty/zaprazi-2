name: Production Advisor Browser QA

on:
  pull_request:
    paths:
      - "tests/production-advisor-smoke.mjs"
      - "scripts/audit-live-night-wc-navigation.mjs"
      - "scripts/audit-live-walker-hub.mjs"
      - "scripts/audit-live-bed-cost.mjs"
      - "scripts/audit-live-wheelchair-doorway.mjs"
      - "scripts/audit-live-bathroom-measurements.mjs"
      - "src/bathroom/measurement-next-step.js"
      - "assets/js/toilet-riser-advisor.js"
      - "assets/js/toilet-support-advisor.js"
      - "assets/js/toilet-chair-advisor.js"
      - "assets/js/shower-chair-advisor.js"
      - "assets/js/bath-transfer-advisor.js"
      - "scripts/audit-live-search-guidance.mjs"
      - "scripts/audit-live-editorial-seo.mjs"
      - "scripts/lib/yoast-https-graph.mjs"
      - "scripts/audit-live-problem-guides.mjs"
      - "scripts/audit-live-legacy-canary-dom.mjs"
      - ".github/workflows/production-advisor-qa.yml"
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install read-only browser smoke dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Resolve current production release for PR-only checks
        env:
          ZP_LIVE_ORIGIN: https://zaprazi.cz
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          # On a PR, the next release is not deployed yet: audit the live version.
          # On manual dispatch (after deploy), enforce the checked-out source version.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LIVE_VERSION="$(curl --fail --silent --show-error --location https://zaprazi.cz/wp-json/zaprazi/v1/affiliate-readiness | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{let v=JSON.parse(s).release;if(!/^\\d+\\.\\d+\\.\\d+$/.test(v))process.exit(1);process.stdout.write(v)})")"
            test -n "$LIVE_VERSION"
            echo "::notice::Pre-deploy QA runs against currently deployed release $LIVE_VERSION. Manually dispatch this workflow after the new version is deployed."
            export ZP_RELEASE="$LIVE_VERSION"
            echo "ZP_RELEASE=$LIVE_VERSION" >> "$GITHUB_ENV"
          fi

      - name: Confirm deployed bed-cost calculator clears obsolete result on invalid input
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-bed-cost.mjs
      - name: Run safety and purchase-gate QA against deployed production
        env:
          ZP_LIVE_ORIGIN: https://zaprazi.cz
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/production-advisor-smoke.mjs
      - name: Check night-toilet issue routing and reciprocal links in deployed DOM
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-night-wc-navigation.mjs
      - name: Verify search rescue on deployed multilingual and multiword queries
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-search-guidance.mjs
      - name: Check latest published problem guides, SEO, safety and real inbound links
        env:
          ZP_LIVE_ORIGIN: https://zaprazi.cz
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-problem-guides.mjs
      - name: Verify live walker problem-to-advisor decision routing and reciprocal links
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-walker-hub.mjs
      - name: Verify wheelchair doorway measuring guide and private width checker
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-wheelchair-doorway.mjs
      - name: Validate bathroom guide and six contextual stage-two measurement routes
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-live-bathroom-measurements.mjs

  editorial-seo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install read-only browser audit dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Preflight render of real cohort article bodies (no WordPress writes)
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/audit-legacy-cohort-preflight.mjs
      - name: Audit all core decision pages for SEO and internal link health
        env:
          CHROME_BIN: /usr/bin/google-chrome
          ZP_ALLOW_CANONICAL_HTTP_ON_0_8_134: ${{ github.event_name == 'pull_request' }}
        run: node scripts/audit-live-editorial-seo.mjs
