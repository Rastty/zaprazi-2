name: Zápraží affiliate runtime parity (read-only)

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit-live-affiliate-runtime-25.mjs"
      - "tests/live-affiliate-runtime-25.test.js"
      - ".github/workflows/production-affiliate-runtime-qa.yml"
  pull_request:
    paths:
      - "scripts/audit-live-affiliate-runtime-25.mjs"
      - "tests/live-affiliate-runtime-25.test.js"
      - ".github/workflows/production-affiliate-runtime-qa.yml"
  workflow_dispatch:
  schedule:
    # Four light checks per day: two own-origin GET requests; no merchant clicks.
    - cron: "13 1,7,13,19 * * *"

permissions:
  contents: read

concurrency:
  group: zp-public-affiliate-runtime-parity
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Source-only affiliate route, network and privacy contracts
        run: node --test tests/live-affiliate-runtime-25.test.js

  live:
    needs: contract
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Read only 25 actual exposed routes from public WordPress
        run: node scripts/audit-live-affiliate-runtime-25.mjs
