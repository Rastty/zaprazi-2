name: Zápraží production availability smoke
on:
  workflow_dispatch:
  schedule:
    - cron: "40 6,18 * * *"
  pull_request:
    paths:
      - "scripts/production-availability-smoke.mjs"
      - "tests/production-availability-smoke.test.js"
      - ".github/workflows/production-availability-smoke.yml"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Unit tests for read-only assertions
        run: node --test tests/production-availability-smoke.test.js
      - name: Production homepage read-only smoke
        run: node scripts/production-availability-smoke.mjs
