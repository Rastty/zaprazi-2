name: Public SEO Sitemap Audit

on:
  # A single verified WordPress deploy acknowledgment also checks the public
  # XML sitemap. Chrome QA is triggered separately by the same exact file.
  # This is read-only and does not change WordPress or submit URLs to Google.
  push:
    branches: [main]
    paths:
      - "docs/POSTDEPLOY_QA_TRIGGER.md"
  pull_request:
    paths:
      - "scripts/audit-public-sitemap.mjs"
      - "scripts/check-acquisition-sitemap.mjs"
      - "tests/public-sitemap-audit.test.js"
      - "scripts/audit-205-postdeploy-seo.mjs"
      - "scripts/audit-index-watch-live.mjs"
      - "tests/audit-205-postdeploy-seo.test.js"
      - "tests/audit-index-watch-live.test.js"
      - "tests/acquisition-sitemap-gate.test.js"
      - ".github/workflows/public-seo-sitemap-audit.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

jobs:
  public-sitemap:
    name: Read-only public XML inventory
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests for safe sitemap parser
        run: node --test tests/public-sitemap-audit.test.js tests/acquisition-sitemap-gate.test.js tests/audit-205-postdeploy-seo.test.js tests/audit-index-watch-live.test.js
      - name: Inspect live public sitemap and enforce deployed decision URL discovery
        env:
          ZP_REQUIRE_REQUIRED_PATHS: "1"
        run: node scripts/audit-public-sitemap.mjs
      - name: Verify latest acquisition guide discovered after actual deploy
        env:
          ZP_REQUIRE_DISCOVERY: "1"
        run: node scripts/check-acquisition-sitemap.mjs
      - name: Verify current live contextual links and evidence-backed dated sitemap entries
        run: node scripts/audit-205-postdeploy-seo.mjs
      - name: Check live HTTP, self-canonical, index directives and sitemap on four GSC excluded pages
        # Only exact public URLs; rejects redirects; no indexing requests or WP writes.
        run: node scripts/audit-index-watch-live.mjs
